name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar SDK Android no servidor do GitHub
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.0'

      - name: Configurar Gradle 9.4.1 no servidor do GitHub
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Testar e compilar APK de depuração
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Publicar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeuTreino-Android-v0.3.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
